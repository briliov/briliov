name: Sync Profile Stack

on:
    schedule:
        - cron: "0 0 * * *"
    push:
        branches:
            - main
            - master
        paths:
            - "scripts/sync_profile.py"
            - ".github/workflows/sync-profile.yml"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout profile repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Update README stack icons
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: python scripts/sync_profile.py

            - name: Commit and push README if changed
              run: |
                  git config user.name "${{ github.actor }}"
                  git config user.email "${{ github.actor_id }}+${{ github.actor }}@://github.com"
                  git add README.md
                  git diff --staged --quiet || git commit -m "DOCS: update profile tech stack"
                  git push
